<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miss Universo 2026 | Top 5</title><style>*{box-sizing:border-box}body{margin:0;background:#100e15;color:#fff;font:16px system-ui}main{max-width:560px;margin:auto;padding:20px}h1{font:34px Georgia;color:#efcf8e;margin:8px 0}small{color:#bdb6c4}button,input,select{font:inherit;border:1px solid #544a5d;border-radius:12px;background:#211c29;color:white;padding:12px}button{cursor:pointer}button:disabled{opacity:.45}input,select{width:100%;margin:8px 0}article{display:flex;align-items:center;gap:12px;padding:8px;margin:8px 0;background:#211c29;border:1px solid #403749;border-radius:14px;cursor:pointer}article.on{border:2px solid #efcf8e;background:#352b25}article img{width:66px;height:83px;object-fit:cover;border-radius:8px;background:#39313f}article div{flex:1}article small{display:block;margin-top:4px}article span{font-size:24px;color:#efcf8e}.bar{position:sticky;top:0;background:#100e15;padding:12px 0;z-index:2;display:flex;justify-content:space-between;align-items:center}.gold{background:#efcf8e;color:#17121d;font-weight:bold}footer{display:grid;gap:8px;margin-top:20px}a{color:#efcf8e}p{line-height:1.5}</style><main><small>75ª EDICIÓN · PUERTO RICO</small><h1>Miss Universo 2026</h1><p>Elige tus cinco finalistas entre las doce clasificadas.</p><label>Tu nombre<input id="name" maxlength="60" placeholder="Escribe tu nombre"></label><select id="saved" aria-label="Quinielas guardadas"></select><button id="fresh">+ Nuevo participante</button><div class="bar"><strong id="count"></strong><button id="clear">Limpiar selección</button></div><div id="list"></div><label>Tu ganadora (opcional)<select id="winner"></select></label><footer><button class="gold" id="png">Descargar imagen PNG</button><button id="txt">Descargar lista</button><button id="save">Guardar quiniela</button><button id="share">Compartir imagen</button></footer><p id="status" role="status"></p><small>Retratos: Miss Universe, vía <a href="https://www.businessinsider.com/miss-universe-pageant-contestants-photos-2026-11">Business Insider</a>. Clasificadas: <a href="https://www.milenio.com/estilo/miss-universo-2026-quienes-son-las-finalistas">Milenio</a>. Guardado local por dispositivo.</small></main><script>
const rows=[['CL','Chile','Dominga López','6af72ea0cbe21204707352ad'],['DO','República Dominicana','Melissa Núñez','6af73045b2c29afb4e56aa1f'],['US','Estados Unidos','Justus Kelley','6af73b5ab2c29afb4e56aa97'],['NZ','Nueva Zelanda','Georgia Waddington','6af73692cbe2120470735308'],['CU','Cuba','Mia Dio','6af72f170cc3ffba8779cd41'],['PR','Puerto Rico','Jennifer Barreto','6af737bfcbe2120470735313'],['PH','Filipinas','Bea Millan-Windorski','6af7377eb2c29afb4e56aa65'],['CO','Colombia','María Alejandra López','6af72ed20cc3ffba8779cd3e'],['NI','Nicaragua','Jasmine Blandford','6af736abb2c29afb4e56aa5e'],['VE','Venezuela','Clara Vegas Goetz','6af73ba20cc3ffba8779cdcf'],['CD','RD del Congo','Jessi Kalambayi','6af730160cc3ffba8779cd48'],['FR','Francia','Garance Authié','6af73132b2c29afb4e56aa2b']].sort((a,b)=>a[1].localeCompare(b[1],'es'));
const $=s=>document.getElementById(s), get=id=>rows.find(r=>r[0]===id), flag=id=>String.fromCodePoint(...[...id].map(c=>127397+c.charCodeAt(0)));let picks=[],win='',key='',records={};try{records=JSON.parse(localStorage.getItem('mu26-top5-v1')||'{}')||{}}catch{};function store(){if(!$('name').value.trim())return false;if(!key)key=Date.now().toString();records[key]={name:$('name').value.trim(),picks:[...picks],win};try{localStorage.setItem('mu26-top5-v1',JSON.stringify(records))}catch{return false}return true}function saved(){$('saved').replaceChildren(new Option('Quinielas guardadas',''));Object.entries(records).forEach(([k,v])=>$('saved').add(new Option(v.name,k)));$('saved').value=key}function toggle(id){if(picks.includes(id)){picks=picks.filter(x=>x!==id);if(win===id)win=''}else if(picks.length<5)picks.push(id);else{$('status').textContent='Quita una candidata antes de elegir otra.';return}store();saved();render()}function render(){$('count').textContent='Top 5 · '+picks.length+'/5';$('list').replaceChildren();for(const [id,country,name,photo] of rows){let a=document.createElement('article');a.className=picks.includes(id)?'on':'';a.tabIndex=0;a.setAttribute('role','button');a.setAttribute('aria-pressed',picks.includes(id));let im=new Image();im.src='https://i.insider.com/'+photo+'?auto=webp&format=jpeg&width=600';im.alt='Retrato de '+name;let d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('small'),check=document.createElement('span');b.textContent=flag(id)+' '+country;s.textContent=name;d.append(b,s);check.textContent=picks.includes(id)?'✓':'○';a.append(im,d,check);a.onclick=()=>toggle(id);a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(id)}};$('list').append(a)}$('winner').replaceChildren(new Option('Sin elegir',''));picks.forEach(id=>$('winner').add(new Option(get(id)[1],id)));$('winner').value=win;for(const id of ['png','txt','share'])$(id).disabled=picks.length!==5}function ready(){if(!$('name').value.trim()){alert('Escribe tu nombre');$('name').focus();return false}if(picks.length!==5)return false;store();saved();return true}function text(){return 'MISS UNIVERSO 2026 — TOP 5\nQuiniela de '+$('name').value.trim()+'\n\n'+picks.map(id=>get(id).slice(1,3).join(' — ')).join('\n')+'\n\nGanadora: '+(win?get(win)[1]:'Sin elegir')}function download(b,ext){if(!b)return;let a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download='top5-'+$('name').value.trim().replace(/[^\p{L}\p{N}]+/gu,'-')+'.'+ext;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}function image(){let c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d');x.fillStyle='#17121d';x.fillRect(0,0,1080,1350);x.strokeStyle='#efcf8e';x.lineWidth=3;x.strokeRect(28,28,1024,1294);x.textAlign='center';x.fillStyle='#efcf8e';x.font='58px Georgia';x.fillText('MISS UNIVERSO 2026',540,125);x.font='34px system-ui';x.fillText('MI TOP 5',540,195);x.fillStyle='#fff';x.fillText($('name').value.trim(),540,260,900);picks.forEach((id,i)=>{let r=get(id),y=380+i*135;x.fillStyle='#efcf8e';x.font='42px Georgia';x.fillText(r[1],540,y,900);x.fillStyle='#fff';x.font='30px system-ui';x.fillText(r[2],540,y+45,900)});x.fillStyle='#efcf8e';x.font='32px system-ui';x.fillText('GANADORA',540,1125);x.font='48px Georgia';x.fillText(win?get(win)[1]:'Sin elegir',540,1200,900);return new Promise(r=>c.toBlob(r,'image/png'))}$('name').oninput=()=>{store();saved()};$('winner').onchange=()=>{win=$('winner').value;store()};$('fresh').onclick=()=>{store();key='';picks=[];win='';$('name').value='';saved();render();window.scrollTo(0,0);$('name').focus()};$('clear').onclick=()=>{picks=[];win='';store();render()};$('saved').onchange=()=>{let k=$('saved').value;if(!records[k])return;store();key=k;let v=records[k];$('name').value=v.name;picks=[...new Set(v.picks.filter(get))].slice(0,5);win=picks.includes(v.win)?v.win:'';render();saved()};$('save').onclick=()=>{if(ready())$('status').textContent=store()?'Guardada en este dispositivo.':'No se pudo guardar localmente; descarga la lista.'};$('txt').onclick=()=>{if(ready())download(new Blob([text()],{type:'text/plain;charset=utf-8'}),'txt')};$('png').onclick=async()=>{if(ready())download(await image(),'png')};$('share').onclick=async()=>{if(!ready())return;let b=await image();if(!b)return;let f=new File([b],'quiniela-top5.png',{type:'image/png'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}download(b,'png')};saved();render();
</script></html>
